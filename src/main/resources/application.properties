spring.application.name=shiftledger

spring.datasource.url=jdbc:postgresql://localhost:5433/shiftledger
spring.datasource.username=shiftledger
spring.datasource.password=shiftledger

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# DEV ONLY
shiftledger.jwt.secret=${JWT_SECRET:pQdlcWIGl+q6ctyEGd/UuDOarOfdLXAYwCovRGxhyGg=}

# render tells the app which port to use
server.port=${PORT:8080}

# render handles https in front of the app, so trust its forwarded headers
# (without this, swagger builds http links and the browser blocks them)
server.forward-headers-strategy=framework